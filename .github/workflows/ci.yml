name: CI

on:
  push:
    branches: [ main, docs/overhaul ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run syntax checks
        run: node --check ./build-site.mjs && node --check ./serve-reader.mjs

      - name: Run test suite
        run: npm test
